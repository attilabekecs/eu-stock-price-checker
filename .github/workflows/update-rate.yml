name: Update MNB exchange rate

on:
  schedule:
    - cron: "15 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch current MNB rate
        run: node scripts/update-mnb-rate.mjs
      - name: Commit changed rate
        run: |
          if git diff --quiet -- public/data/exchange-rate.json; then
            echo "No exchange-rate change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/exchange-rate.json
          git commit -m "Update MNB exchange rate"
          git push

